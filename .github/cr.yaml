# chart-releaser configuration
# https://github.com/helm/chart-releaser

# Generate release notes automatically from commits since the previous tag.
generate-release-notes: true

# Push the updated index.yaml to the gh-pages branch after each release.
push: true

# Skip uploading chart tarballs that already exist in a GitHub Release.
skip-existing: true

# Do not mark the chart release as "latest" — the v* code release should be latest.
# This avoids GitHub briefly locking the release during "make latest" processing,
# which causes 422 "Cannot upload assets to an immutable release" on the asset upload.
make-release-latest: false
