{{- if .Values.crds.install -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: users.auth.openkube.io
  labels:
    {{- include "kubeuser.labels" . | nindent 4 }}
spec:
  group: auth.openkube.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Current phase of the user
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Auto-renewal enabled
      jsonPath: .spec.auth.autoRenew
      name: AutoRenew
      type: boolean
    - description: Certificate expiry time
      jsonPath: .status.expiryTime
      name: Expiry
      type: string
    - description: Next renewal time
      jsonPath: .status.nextRenewalAt
      name: NextRenewal
      type: string
    - description: Time since the user was created
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: Status message
      jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: User is the Schema for the users API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UserSpec defines the desired state of User
            properties:
              auth:
                description: Auth defines authentication configuration (MANDATORY)
                properties:
                  autoRenew:
                    description: 'AutoRenew enables automatic certificate renewal
                      (default: true)'
                    type: boolean
                  renewBefore:
                    description: |-
                      RenewBefore specifies when to renew before expiry
                      Overrides the default 33% rule. Must be less than TTL.
                      Examples: "5m", "30d", "720h"
                    type: string
                  ttl:
                    description: |-
                      TTL specifies credential time-to-live (lifetime)
                      For x509: certificate validity period (default: 2160h = 90 days)
                      For oidc: ignored (placeholder for future implementation)
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  type:
                    description: Type specifies the authentication method (MANDATORY)
                    enum:
                    - x509
                    - oidc
                    type: string
                required:
                - type
                type: object
              clusterRoles:
                description: |-
                  ClusterRoles is a list of cluster-wide ClusterRole bindings. listType=map
                  makes the apiserver enforce uniqueness of existingClusterRole natively
                  (rejected at admission, cannot be bypassed) and enables per-entry
                  server-side apply. MaxItems is a deliberate object-size/DoS bound.
                items:
                  description: ClusterRoleSpec defines cluster-wide access by binding
                    to an existing ClusterRole
                  properties:
                    existingClusterRole:
                      description: ExistingClusterRole is the name of the ClusterRole
                        to bind
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - existingClusterRole
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - existingClusterRole
                x-kubernetes-list-type: map
              roles:
                description: |-
                  Roles is a list of namespace-scoped Role bindings. Uniqueness per
                  (namespace, role) is enforced by the webhook and controller via
                  RoleSpec.BindingKey — a composite key can't be a CRD listMapKey, so it
                  lives in code. MaxItems is a deliberate object-size/DoS bound.
                items:
                  description: RoleSpec defines namespace-scoped access by binding
                    to an existing Role or ClusterRole
                  properties:
                    existingClusterRole:
                      description: |-
                        ExistingClusterRole is the name of a ClusterRole to bind with a RoleBinding in the namespace
                        Mutually exclusive with ExistingRole
                      maxLength: 253
                      type: string
                    existingRole:
                      description: |-
                        ExistingRole is the name of the Role inside that namespace
                        Mutually exclusive with ExistingClusterRole
                      maxLength: 253
                      type: string
                    namespace:
                      description: Namespace where the RoleBinding will be created
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - namespace
                  type: object
                maxItems: 100
                type: array
            required:
            - auth
            type: object
          status:
            description: UserStatus defines the observed state of User
            properties:
              conditions:
                description: Conditions follow Kubernetes conventions for detailed
                  status
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiryTime:
                description: |-
                  ExpiryTime is the actual expiry timestamp (RFC3339 format)
                  This comes from the actual certificate NotAfter time when available
                type: string
              message:
                description: Message provides details about the current status
                type: string
              nextRenewalAt:
                description: |-
                  NextRenewalAt is when the certificate will be automatically renewed
                  This consolidates the previous RenewalTime and NextRenewalTime fields
                format: date-time
                type: string
              phase:
                description: Phase is a simple high-level status (Pending, Active,
                  Expired, Error, Renewing)
                type: string
              renewalHistory:
                description: RenewalHistory tracks recent renewal attempts for observability
                items:
                  description: RenewalAttempt tracks a single renewal attempt
                  properties:
                    csrName:
                      description: CSRName is the name of the CSR created for this
                        renewal
                      type: string
                    message:
                      description: Message provides details about the renewal attempt
                      type: string
                    success:
                      description: Success indicates if the renewal was successful
                      type: boolean
                    timestamp:
                      description: Timestamp when the renewal was attempted
                      format: date-time
                      type: string
                  required:
                  - success
                  - timestamp
                  type: object
                type: array
              rotationStep:
                description: |-
                  RotationStep provides granular visibility into certificate rotation progress
                  Values: GeneratingKey, CreatingCSR, WaitingForApproval, PerformingAtomicFlip, Finalizing
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
