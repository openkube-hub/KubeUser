{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kubeuser.fullname" . }}-metrics
  namespace: {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubeuser.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kubeuser.managerSelectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if .Values.metrics.secure }}
      scheme: https
      # Uses the Prometheus pod's own projected SA token for authn/authz.
      # Ensure prometheusServiceAccount is set so that SA is bound to metrics-reader.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      {{- if .Values.metrics.certManager.enabled }}
      tlsConfig:
        insecureSkipVerify: false
        serverName: {{ include "kubeuser.fullname" . }}-metrics-service.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "kubeuser.fullname" . }}-metrics-cert
            key: ca.crt
      {{- else }}
      # cert-manager is disabled — controller uses an auto-generated self-signed cert.
      # Enable metrics.certManager for production-grade TLS.
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      {{- else }}
      scheme: http
      {{- end }}
{{- end }}
