# Example values for KubeUser Helm chart
# This file demonstrates various configuration options with production-ready examples
# Only includes fields that are actually implemented in the Helm templates

# Override the name of the chart (optional)
nameOverride: ""
# Override the full name of the chart (optional)
fullnameOverride: ""

# Global settings
global:
  nameSuffix: "-prod"

# Image configuration
image:
  repository: kubeuser/controller
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

# Image pull secrets (for private registries)
imagePullSecrets:
- name: my-registry-secret

# Service Account configuration
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/kubeuser-role"
  name: "kubeuser-sa"

# Pod annotations and labels
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
podLabels:
  version: "v1.0.0"
  component: "controller"

# Pod security context (pod-level security)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

# Container security context (container-level security)
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 3000
  capabilities:
    drop:
    - "ALL"

# Deployment configuration
replicaCount: 2

# Resource limits and requests (production values)
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health check probes
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Node selection and scheduling
nodeSelector:
  kubernetes.io/os: linux
  node-role.kubernetes.io/worker: "true"

# Tolerations for scheduling
tolerations:
- key: "node-role.kubernetes.io/control-plane"
  operator: "Exists"
  effect: "NoSchedule"
- key: "dedicated"
  operator: "Equal"
  value: "kubeuser"
  effect: "NoSchedule"

# Pod affinity/anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kubeuser
        topologyKey: kubernetes.io/hostname
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 50
      preference:
        matchExpressions:
        - key: node-type
          operator: In
          values:
          - "compute"

# Manager configuration
manager:
  args:
    - --leader-elect
    - --health-probe-bind-address=:8081
    - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
    - --zap-log-level=info

# Webhook configuration
webhook:
  enabled: true
  certPath: /tmp/k8s-webhook-server/serving-certs
  # Production: Fail (block requests if webhook fails)
  # Development: Ignore (allow requests if webhook fails)
  failurePolicy: Fail
  certManager:
    duration: 8760h    # 1 year
    renewBefore: 2160h # 90 days
  service:
    type: ClusterIP
    port: 443
    targetPort: 9443

# Metrics configuration
metrics:
  enabled: true
  # Serve metrics over HTTPS with authn/authz filtering (recommended for production).
  # Set to false only for development; also disables TLS in the ServiceMonitor.
  secure: true
  service:
    type: ClusterIP
    # Use 8443 for HTTPS (default) or 8080 for HTTP (when secure: false).
    port: 8443
  # cert-manager TLS for the metrics endpoint.
  # Mirrors the webhook cert setup — creates a self-signed Issuer and Certificate.
  # When disabled, controller-runtime auto-generates a self-signed cert (not for production).
  certManager:
    enabled: true
    duration: 8760h
    renewBefore: 720h
  # ServiceMonitor for Prometheus Operator scraping.
  # Requires prometheus-operator (or kube-prometheus-stack) to be installed.
  serviceMonitor:
    enabled: true
    # Namespace to deploy the ServiceMonitor into.
    # Defaults to the release namespace if not set.
    namespace: ""
    # How frequently Prometheus scrapes the metrics endpoint.
    interval: 30s
    # Timeout for each scrape request.
    scrapeTimeout: 10s
    # Extra labels to add to the ServiceMonitor (e.g. to match a Prometheus instance's serviceMonitorSelector).
    additionalLabels:
      release: prometheus-stack
    # Grant the Prometheus ServiceAccount permission to scrape /metrics by binding it
    # to the metrics-reader ClusterRole. Set both name and namespace to enable.
    # The ServiceMonitor uses bearerTokenFile (the Prometheus pod's own projected SA token),
    # so no separate Secret is needed — just provide the SA name here.
    prometheusServiceAccount:
      name: "prometheus-stack-kube-prom-prometheus"
      namespace: "monitoring"

# Authentication and renewal defaults
# These values are injected into the operator via environment variables
# (KUBEUSER_DEFAULT_TTL, KUBEUSER_DEFAULT_AUTORENEW) and applied by the
# mutating webhook when User resources are created without explicit values.
authDefaults:
  ttl: "2160h"
  autoRenew: true

# Environment variables (additional to the core operator settings below)
env:
  # Default is the loopback control-plane address on the secure port.
  # Override with your reachable API server URL, e.g.:
  #   KUBERNETES_API_SERVER: "https://api.example.com:6443"
  KUBERNETES_API_SERVER: "https://127.0.0.1:6443"
  CLUSTER_DOMAIN: "cluster.local"

# CSR signer configuration (managed Kubernetes support)
# This controls which Kubernetes signer is used for certificate CSRs.
# - Vanilla Kubernetes: kubernetes.io/kube-apiserver-client
# - EKS:                beta.eks.amazonaws.com/app-client
# - GKE/AKS/custom:     set to your cluster's signer name
signerName: "kubernetes.io/kube-apiserver-client"

# RBAC configuration
rbac:
  create: true
  # Signer names that KubeUser is allowed to approve CSRs for.
  # This must include the signer configured via .Values.signerName.
  signerResourceNames:
    - "kubernetes.io/kube-apiserver-client"

# CRD configuration
crds:
  install: true

# Common labels applied to all resources
commonLabels:
  environment: production
  team: platform
  project: kubeuser
  version: "v1.0.0"
